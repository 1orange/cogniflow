[project]
name = "cogniflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Jean Dossa Tsimbazafy",email = "orangel33t@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.3.2,<3.0.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "hidapi (>=0.14.0.post4,<0.15.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "pyhidapi (>=0.0.2,<0.0.3)",
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12,<1"

[tool.poetry]
include = ["py.typed"]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
