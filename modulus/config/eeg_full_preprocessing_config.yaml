# Configuration with FULL EEG Preprocessing Pipeline
# Includes all EEG-specific techniques for optimal signal cleaning

Data:
  source: data/prepared/
  loader: npy
  feature_key: features
  target_key: labels
  metadata_key: metadata
  use_metadata: false
  task_type: classification
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    random_state: 42
    stratify: true

# Full EEG preprocessing pipeline
Preprocessing:
  # === STEP 1: EEG SIGNAL CLEANING ===
  
  # Remove 50 Hz power line noise (essential!)
  notch_filter: true
  notch_freq: 50.0            # 50 Hz for EU
  notch_quality: 30.0
  
  # Band-pass filter 0.5-40 Hz (standard EEG)
  bandpass_filter: true
  bandpass_low: 0.5
  bandpass_high: 40.0
  bandpass_order: 4
  
  # Smooth with 100ms moving average
  smoothing_filter: true
  smoothing_window_ms: 100.0
  
  # === STEP 2: ARTIFACT REMOVAL ===
  
  # Automatic epoch rejection
  artifact_rejection: true
  amplitude_threshold: 100.0   # Reject if |signal| > 100 µV
  flatline_threshold: 0.1
  flatline_duration_ms: 200.0
  hf_power_threshold: 5.0
  hf_freq_min: 30.0
  reject_mode: 'mark'          # Mark bad epochs as zero
  
  # === STEP 3: FEATURE EXTRACTION ===
  
  # Extract statistical features
  extract_features: true
  feature_list:
    - mean
    - std
    - energy
  
  # === STEP 4: NORMALIZATION ===
  
  standard_scaler: true
  pca_components: null  # No PCA needed with extracted features
  
  # Sampling frequency
  sampling_frequency: 128.0

# Models optimized for clean EEG data
Models:
  - name: SVM
    params:
      kernel: rbf
      C: 1.0
      random_state: 42
      probability: true
      class_weight: balanced

  - name: RandomForest
    params:
      n_estimators: 100
      max_depth: 20
      random_state: 42
      n_jobs: -1
      class_weight: balanced

  - name: LogisticRegression
    params:
      max_iter: 1000
      random_state: 42
      n_jobs: -1
      class_weight: balanced

  - name: DecisionTree
    params:
      max_depth: 20
      random_state: 42
      class_weight: balanced

Output:
  path: results/eeg_full_preprocessing/
  formats:
    - csv
    - json
    - html
  primary_metric: f1_score

