[package]
name = "emotiv-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust-based USB reader for Emotiv with PyO3 bindings"
repository = "https://example.com/your-repo"

[lib]
name = "emotiv_rs"
crate-type = ["cdylib"]

[tool.maturin]
python-source = "python"
strip = true

[dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
cipher = "0.4.4"
crossbeam-channel = "0.5.15"
hex = "0.4.3"
hidapi = "2.6.3"
log = "0.4.28"
once_cell = "1.21.3"
parking_lot = "0.12.5"
pyo3 = { version = "0.27.1", features = ["extension-module", "auto-initialize"] }
thiserror = "2.0.17"


[profile.release]
lto = true
codegen-units = 1
opt-level = 3


